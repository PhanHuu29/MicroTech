<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">MicroTech horizontal logo</title>
  <desc id="desc">A standalone M circuit icon inside a rounded square badge, followed by the MicroTech wordmark.</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="1" stop-color="#f3ecff"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0fd5f3"/>
      <stop offset=".52" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#9b4dff"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17e1ef"/>
      <stop offset="1" stop-color="#028cff"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1679ff"/>
      <stop offset="1" stop-color="#803af6"/>
    </linearGradient>
    <linearGradient id="tech" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11cfe9"/>
      <stop offset=".55" stop-color="#147cff"/>
      <stop offset="1" stop-color="#9a50f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#116cff" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Separate M badge -->
  <g filter="url(#shadow)">
    <rect x="34" y="34" width="352" height="352" rx="76" fill="url(#badge)" stroke="url(#frame)" stroke-width="18"/>
    <!-- M ribbons -->
    <path d="M91 273V128c0-28 34-42 54-22l66 66 66-66c20-20 54-6 54 22v145l-54-1V183l-40 40c-15 15-38 15-53 0l-40-40v90z" fill="url(#ribbonA)"/>
    <path d="M202 185l53-53c14-14 36-14 50 0l26 26v115h-54v-92l-47 47c-11 11-29 11-40 0l-46-46v-54z" fill="url(#ribbonB)" opacity=".96"/>
    <!-- Circuit details -->
    <g fill="none" stroke="#0b2d6f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M109 180v87l27 27"/>
      <path d="M294 179v68l-25 25"/>
    </g>
    <g fill="#fff" stroke="#11cfe9" stroke-width="7">
      <circle cx="109" cy="164" r="12"/>
      <circle cx="142" cy="299" r="12"/>
      <circle cx="294" cy="163" r="12"/>
      <circle cx="264" cy="278" r="12"/>
    </g>
  </g>

  <!-- Clearly separated wordmark -->
  <g font-family="Inter, Arial, Helvetica, sans-serif" font-size="184" font-weight="800" letter-spacing="-9">
    <text x="460" y="260" fill="#061b4e">Micro</text>
    <text x="956" y="260" fill="url(#tech)">Tech</text>
  </g>
</svg>
